<!-- birthday_bhabhi.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Bhabhisa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">
    <section class="hero">

      <div class="birthday-text">
        <div class="happy">Happy</div>
        <div class="birthday">Birthday Bhabhisa</div>

        <div class="date-pill">
          <span id="dateText">8 october 2026</span>
        </div>
      </div>

      <div class="character-area">

        <div class="balloon balloon-one"></div>
        <div class="balloon balloon-two"></div>

        <div class="balloon-string string-one"></div>
        <div class="balloon-string string-two"></div>

        <div class="circle">
          <div class="teddy">🧸</div>
          <div class="mini-heart">♥</div>
        </div>

        <button class="open-btn" id="openBtn">Open ♥</button>

      </div>

    </section>
  </main>


  <div class="modal" id="modal">

    <div class="letter">

      <button class="close" id="closeBtn">×</button>

      <div class="letter-title">
        For My Special Bhabhisa <span>♥</span>
      </div>

      <div class="letter-body">

        <p class="message">
          Happy Birthday, Bhabhisa! 🎂
          <br><br>
          Aap hamare family ka bahut special part ho.
          Aapki smile hamesha ghar mein happiness lekar aaye.
          <br><br>
          Wishing you lots of happiness and beautiful memories.
          <br><br>
          Hamesha khush raho! ✨
        </p>

      </div>

      <div class="letter-sign">
        Best Wishes ♥
      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
